<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16291b">
<title>おとぎの森を散歩する</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#16291b;overscroll-behavior:none}
body{font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;color:#3a2a1e;
  -webkit-user-select:none;user-select:none;touch-action:none;position:fixed;inset:0}
#stage{position:absolute;overflow:hidden;--u:2px;background:#1e3e24;cursor:pointer}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;
  image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
.px{image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
.off{display:none!important}

/* ── 会話 ── */
#portrait{position:absolute;left:calc(var(--u)*-2);bottom:calc(var(--u)*26);height:calc(var(--u)*106);width:auto;
  z-index:2;pointer-events:none;opacity:0;transform:translateX(calc(var(--u)*-14));transition:opacity .25s,transform .25s}
#portrait.show{opacity:1;transform:none}
#portrait[data-k="kumaP"]{bottom:calc(var(--u)*42)}
#portrait[data-k="wolfP"]{bottom:calc(var(--u)*44)}
#portrait[data-k="majoP"]{height:calc(var(--u)*104);bottom:calc(var(--u)*52);left:calc(var(--u)*-8)}
#dlg{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);bottom:calc(var(--u)*27);min-height:calc(var(--u)*47);
  z-index:3;background:#fff8e7;padding:calc(var(--u)*6) calc(var(--u)*6) calc(var(--u)*7);
  box-shadow:calc(var(--u)*-1) 0 0 0 #fff8e7,calc(var(--u)*1) 0 0 0 #fff8e7,0 calc(var(--u)*-1) 0 0 #fff8e7,0 calc(var(--u)*1) 0 0 #fff8e7,
   calc(var(--u)*-2) 0 0 0 #663931,calc(var(--u)*2) 0 0 0 #663931,0 calc(var(--u)*-2) 0 0 #663931,0 calc(var(--u)*2) 0 0 #663931,
   0 0 0 calc(var(--u)*1) #663931, 0 calc(var(--u)*4) 0 0 rgba(30,20,30,.28);
  font-size:calc(var(--u)*8);line-height:calc(var(--u)*12);pointer-events:none}
#dlg.top{bottom:auto;top:calc(var(--u)*12)}
#dname{position:absolute;left:calc(var(--u)*5);top:calc(var(--u)*-8);background:#663931;color:#fff8e7;
  font-size:calc(var(--u)*7);line-height:calc(var(--u)*10);padding:0 calc(var(--u)*5);
  box-shadow:calc(var(--u)*-1) 0 0 0 #663931,calc(var(--u)*1) 0 0 0 #663931}
#dbody{display:flex;align-items:center;gap:calc(var(--u)*5);min-height:calc(var(--u)*34)}
#dicon{width:calc(var(--u)*16);height:calc(var(--u)*16);flex:none}
#dtext{white-space:pre-line;line-break:strict;overflow-wrap:anywhere;word-break:auto-phrase;flex:1}
#dt2{visibility:hidden}
#dlg.narr #dtext{color:#5a4636}
#dlg.item #dtext{color:#247353;font-size:calc(var(--u)*7)}
#dlg.item #dbody{gap:calc(var(--u)*4)}
#dnext{position:absolute;right:calc(var(--u)*5);bottom:calc(var(--u)*1);font-size:calc(var(--u)*6);color:#8f563b;
  visibility:hidden;animation:bob .8s steps(2) infinite}
#dlg.done #dnext{visibility:visible}
@keyframes bob{50%{transform:translateY(calc(var(--u)*1))}}

/* ── アイテム欄・音 ── */
#items{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*4);display:flex;gap:calc(var(--u)*2);z-index:4;transition:opacity .6s}
.slot{width:calc(var(--u)*18);height:calc(var(--u)*18);background:#fff8e7;padding:calc(var(--u)*1);cursor:pointer;position:relative;
  box-shadow:inset 0 0 0 calc(var(--u)*1) #c9b89c,calc(var(--u)*-1) 0 0 0 #663931,calc(var(--u)*1) 0 0 0 #663931,0 calc(var(--u)*-1) 0 0 #663931,0 calc(var(--u)*1) 0 0 #663931}
.slot.empty{background:#e4d7bd}
.slot.empty::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--u)*2);height:calc(var(--u)*2);
  margin:calc(var(--u)*-1) 0 0 calc(var(--u)*-1);background:#c9b89c}
.slot img{width:calc(var(--u)*16);height:calc(var(--u)*16);display:block}
.slot.pop img{animation:pop .5s steps(5)}
@keyframes pop{0%{transform:translateY(calc(var(--u)*-8));opacity:0}60%{transform:translateY(calc(var(--u)*1));opacity:1}100%{transform:none}}
#tip{position:absolute;left:calc(var(--u)*4);bottom:calc(var(--u)*27);max-width:calc(var(--u)*134);z-index:5;background:#fff8e7;
  padding:calc(var(--u)*4) calc(var(--u)*6);font-size:calc(var(--u)*7);line-height:calc(var(--u)*10.5);pointer-events:none;
  box-shadow:calc(var(--u)*-1) 0 0 0 #663931,calc(var(--u)*1) 0 0 0 #663931,0 calc(var(--u)*-1) 0 0 #663931,0 calc(var(--u)*1) 0 0 #663931,0 calc(var(--u)*3) 0 0 rgba(30,20,30,.25)}
#tip b{display:block;font-weight:normal;color:#247353}
#snd{position:absolute;right:calc(var(--u)*4);bottom:calc(var(--u)*4);height:calc(var(--u)*12);z-index:4;font:inherit;
  font-size:calc(var(--u)*6.5);line-height:calc(var(--u)*12);padding:0 calc(var(--u)*4);border:0;border-radius:0;color:#663931;background:#fff8e7;cursor:pointer;
  box-shadow:calc(var(--u)*-1) 0 0 0 #663931,calc(var(--u)*1) 0 0 0 #663931,0 calc(var(--u)*-1) 0 0 #663931,0 calc(var(--u)*1) 0 0 #663931}
#snd.on{background:#afe47c;color:#1e3e24}

/* ── おしまい ── */
#end{position:absolute;left:0;right:0;top:66%;z-index:6;text-align:center;color:#fff8e7;pointer-events:none;opacity:0;transition:opacity 1.6s}
#end.show{opacity:1}
#end .a{font-size:calc(var(--u)*11);letter-spacing:.1em}
#end .b{font-size:calc(var(--u)*7.5);margin-top:calc(var(--u)*9);color:#afe47c}

/* ── タイトル ── */
#title{position:absolute;inset:0;z-index:10;background:rgba(22,41,27,.8);color:#fff8e7;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*8);cursor:default;transition:opacity .5s}
#title.hide{opacity:0;pointer-events:none}
#badge{font-size:calc(var(--u)*6.5);line-height:calc(var(--u)*10);background:#d95763;color:#fff8e7;padding:0 calc(var(--u)*5);
  box-shadow:calc(var(--u)*-1) 0 0 0 #d95763,calc(var(--u)*1) 0 0 0 #d95763;transform:rotate(-4deg)}
#title h1{font-weight:normal;font-size:calc(var(--u)*15);line-height:calc(var(--u)*21);margin:calc(var(--u)*8) 0 calc(var(--u)*6);
  text-shadow:0 calc(var(--u)*1) 0 #1e3e24,0 calc(var(--u)*2) 0 #0f2415}
#hero{width:calc(var(--u)*48);height:calc(var(--u)*48);animation:hop 1.2s steps(2) infinite}
@keyframes hop{50%{transform:translateY(calc(var(--u)*-2))}}
#desc{font-size:calc(var(--u)*7.5);line-height:calc(var(--u)*12.5);margin:calc(var(--u)*6) 0 calc(var(--u)*10);color:#f3ecd8}
#start{font:inherit;font-size:calc(var(--u)*10);line-height:calc(var(--u)*20);padding:0 calc(var(--u)*16);border:0;border-radius:0;cursor:pointer;
  color:#1e3e24;background:#afe47c;
  box-shadow:calc(var(--u)*-1) 0 0 0 #afe47c,calc(var(--u)*1) 0 0 0 #afe47c,calc(var(--u)*-2) 0 0 0 #1e3e24,calc(var(--u)*2) 0 0 0 #1e3e24,
   0 calc(var(--u)*-1) 0 0 #1e3e24,0 calc(var(--u)*1) 0 0 #1e3e24,0 calc(var(--u)*4) 0 0 #0f2415}
#start:active{transform:translateY(calc(var(--u)*2))}
#grow{font-size:calc(var(--u)*6.5);margin-top:calc(var(--u)*14);color:#afe47c}
#back{font-size:calc(var(--u)*6.5);margin-top:calc(var(--u)*8);color:#f3ecd8;text-decoration:underline;text-underline-offset:calc(var(--u)*2);padding:calc(var(--u)*3)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="160" height="284"></canvas>
  <img id="portrait" alt="">
  <div id="dlg" class="off">
    <div id="dname"></div>
    <div id="dbody"><img id="dicon" class="px off" alt=""><div id="dtext"><span id="dt1"></span><span id="dt2"></span></div></div>
    <div id="dnext">▼</div>
  </div>
  <div id="items" class="ui">
    <div class="slot empty" data-k="chamomile"></div>
    <div class="slot empty" data-k="thyme"></div>
    <div class="slot empty" data-k="mint"></div>
  </div>
  <div id="tip" class="off"></div>
  <button id="snd" class="ui" type="button" aria-label="音のオン・オフ">♪ OFF</button>
  <div id="end"><div class="a">── おしまい ──</div><div class="b">また森を歩きにおいでね。</div></div>
  <div id="title" class="ui">
    <div id="badge">試作版</div>
    <h1>おとぎの森を<br>散歩する</h1>
    <img id="hero" class="px" alt="種もん">
    <p id="desc">種もんが、森で物語のハーブを<br>集めるおはなし。<br>行きたい場所をタップしてね。</p>
    <button id="start" type="button">はじめる</button>
    <div id="grow">森は少しずつ育っています。</div>
    <a id="back" href="./">← Studio NEMOSHAへもどる</a>
  </div>
</div>

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function RNG(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h2(x,y){let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,s=v=>v*v*(3-2*v),a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1),u=s(fx),v=s(fy);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)}
function ell(c,cx,cy,rx,ry,col){c.fillStyle=col;cx=Math.round(cx);cy=Math.round(cy);
 for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/((ry+.35)*(ry+.35)))));c.fillRect(cx-hw,cy+dy,hw*2+1,1)}}
function spr(rows,map){const h=rows.length,w=rows[0].length,c=mk(w,h),x=c.getContext('2d');
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const k=map[rows[j][i]];if(k){x.fillStyle=k;x.fillRect(i,j,1,1)}}return c}
function flip(src){const c=mk(src.width,src.height),x=c.getContext('2d');x.translate(src.width,0);x.scale(-1,1);x.drawImage(src,0,0);return c}

function rockSprite(w,h,seed){const c=mk(w,h),x=c.getContext('2d'),m=new Uint8Array(w*h),r=RNG(seed),a=r()*6,b=r()*6;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const nx=(i+.5-w/2)/(w/2),ny=(j+.5-h*.56)/(h*.56),an=Math.atan2(ny,nx);
  const d=Math.sqrt(nx*nx+ny*ny)*(1+.09*Math.sin(an*3+a)+.06*Math.sin(an*5+b));m[j*w+i]=d<1&&j<h-0?1:0}
 const at=(i,j)=>i<0||j<0||i>=w||j>=h?0:m[j*w+i];
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!m[j*w+i])continue;
  const edge=!at(i-1,j)||!at(i+1,j)||!at(i,j-1)||!at(i,j+1);
  const lx=(i-w/2)/(w/2),ly=(j-h/2)/(h/2),li=-lx*.55-ly*.85+(h2(i+seed,j)-.5)*.18;
  x.fillStyle=edge?'#2f2c3a':li>.42?'#746f82':li>.05?'#5f5b6d':li>-.4?'#4d495a':'#3f3b4b';x.fillRect(i,j,1,1)}
 return c}

function spline(pts,step){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
 const n=Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step);
 for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
  out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
            .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}

 while(qh<qt){const cur=q[qh++],cx=cur%GC,cy=(cur/GC)|0;
  for(let d=0;d<8;d++){const nx=cx+DX[d],ny=cy+DY[d];if(nx<0||ny<0||nx>=GC||ny>=GR)continue;const ni=ny*GC+nx;
   if(dist[ni]>=0||blocked[ni])continue;if(d>3&&(blocked[cy*GC+nx]||blocked[ny*GC+cx]))continue;dist[ni]=dist[cur]+1;prev[ni]=cur;q[qt++]=ni}}

 for(let i=0;i<N;i++){if(dist[i]<0||(blocked[i]&&i!==s))continue;const x=(i%GC)*CS+2,y=((i/GC)|0)*CS+2,d=(x-tx)*(x-tx)+(y-ty)*(y-ty);if(d<bd){bd=d;best=i}}

   if(d<=left){P.x=p[0];P.y=p[1];left-=d;P.path.shift()}else{P.x+=dx/d*left;P.y+=dy/d*left;left=0}}
  const b=Math.floor(P.step*2);P.step+=dt*3.6;
  if(Math.floor(P.step*2)!==b&&Math.floor(P.step*2)%2===0){sfx.step(Math.floor(P.step));parts.push({x:P.x+(Math.random()-.5)*4,y:P.y,vx:(Math.random()-.5)*6,vy:-5,life:.35,max:.35,col:'#e9f5d0'})}
  if(!P.path.length){P.walk=false;P.path=null;P.step=0;arrive()}}
 if(P.mark){P.mark.t+=dt;if(P.mark.t>.6&&!P.walk)P.mark=null}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1)}
 if(A.on&&S.mode!=='title'&&!S.teaOn){const d=Math.hypot(P.x-PL.fire.x,P.y-PL.fire.y),v=clamp(1-d/110,.12,1);if(Math.random()<dt*7)sfx.crackle(v)}
 updDlg(dt);
}
const dyn=[{y:0,d(c){const x=Math.round(P.x),y=Math.round(P.y),b=P.walk&&Math.floor(P.step*2)%2?-1:0;shadow(c,x,y,5);c.drawImage(IM[P.face],x-8,y-15+b)}}];
function draw(){
 const c=g;c.imageSmoothingEnabled=false;c.globalAlpha=1;c.drawImage(bg,0,0);
 // 水のゆらぎ
 const l=PL.lake;
 for(let i=0;i<9;i++){const ph=(T*.22+i*.37)%1,x=l.x-22+((i*17)%44)+Math.round(ph*5),y=l.y-8+((i*7)%17),w=2+(i%3);
  if(ph>.15&&ph<.8)for(let k=0;k<w;k++)if(lakeMask[y*W+x+k]&&lakeMask[(y-3)*W+x+k]&&lakeMask[y*W+x+k+2]&&lakeMask[y*W+x+k-2])R(c,x+k,y,1,1,i%2?'#c9ecf7':'#a6dcee')}
 // 水面にゆれる姿（かたちだけ、ぼんやりと）
 if(S.lakeV>0){const cx=l.x-2,cy=l.y-5,rows=[2,3,3,2,3,4,5,5,6,6];
  for(let i=0;i<rows.length;i++){const wv=Math.round(Math.sin(T*2.6+i*.9)*1.6),w=rows[i]+((Math.floor(T*3+i)%3)===0?1:0);
   c.globalAlpha=S.lakeV*(.62-.03*i)*(.75+.25*Math.sin(T*4+i));R(c,cx-(w>>1)+wv,cy+i,w,1,'#f4fbff')}
  c.globalAlpha=1;for(let i=0;i<3;i++){const ph=(T*.8+i/3)%1;if(ph<.3)star(c,cx-9+i*9,cy-2+i*4%7,ph/.3)}}
 // タップした場所のしるし
 if(P.mark&&S.mode==='play'){const m=P.mark,rr=1+Math.floor((m.t*5)%3);c.globalAlpha=.75;R(c,m.x-rr,m.y,1,1,'#fff8e7');R(c,m.x+rr,m.y,1,1,'#fff8e7');R(c,m.x,m.y-rr+1,1,1,'#fff8e7');R(c,m.x,m.y+rr-1,1,1,'#fff8e7');c.globalAlpha=1}
 dyn[0].y=P.y;
 const list=ents.concat(dyn).sort((a,b)=>a.y-b.y);
 for(const e of list)e.d(c);
 for(const p of parts){c.globalAlpha=clamp(p.life/p.max,0,1);R(c,p.x,p.y,1,1,p.col)}c.globalAlpha=1;
 // 夜
 if(S.night>0){const n=S.night,x=ngx,f=PL.fire,fl=Math.floor(T*6)%2;
  x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#152260';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='destination-out';
  const hole=(hx,hy,r)=>{x.globalAlpha=.3;ell(x,hx,hy,r,Math.round(r*.8),'#000');x.globalAlpha=.4;ell(x,hx,hy,Math.round(r*.68),Math.round(r*.54),'#000');x.globalAlpha=.5;ell(x,hx,hy,Math.round(r*.38),Math.round(r*.3),'#000')};
  hole(f.x,f.y-4,25+fl);hole(PL.house.x-11,PL.house.y-9,12);hole(PL.house.x+13,PL.house.y-9,12);if(S.doorOpen)hole(PL.house.x,PL.house.y-2,14);
  c.globalAlpha=n*.52;c.drawImage(nightC,0,0);
  c.globalCompositeOperation='lighter';c.globalAlpha=n*.1;
  ell(c,f.x,f.y-4,24+fl,19,'#ff8a2a');ell(c,f.x,f.y-4,14,11,'#ffb347');
  ell(c,PL.house.x-11,PL.house.y-9,10,8,'#ffb347');ell(c,PL.house.x+13,PL.house.y-9,10,8,'#ffb347');if(S.doorOpen)ell(c,PL.house.x,PL.house.y-3,12,10,'#ffb347');
  // ホタル
  for(const q of FF){const fx=Math.round(q.x+Math.sin(T*q.sx+q.p)*q.rx),fy=Math.round(q.y*H+Math.sin(T*q.sy+q.q)*q.ry),b=.5+.5*Math.sin(T*q.b+q.p*3);
   c.globalAlpha=n*b*.35;R(c,fx-1,fy,3,1,'#d6ff7a');R(c,fx,fy-1,1,3,'#d6ff7a');c.globalAlpha=n*(.35+.65*b);R(c,fx,fy,1,1,'#f6ffb0')}
  c.globalCompositeOperation='source-over';c.globalAlpha=1}
 // 紅茶の場面
 if(S.tea>0)drawTea(c,S.tea);
}
function drawTea(c,a){
 const cx=W>>1,cy=Math.round(H*.43);
 c.globalAlpha=a*.9;R(c,0,0,W,H,'#130d1f');
 const b=clamp((a-.35)/.65,0,1);if(b<=0){c.globalAlpha=1;return}
 c.globalAlpha=b*.5;ell(c,cx,cy+6,50,40,'#2a1a2c');ell(c,cx,cy+6,38,30,'#3a2230');c.globalAlpha=b*.35;ell(c,cx,cy+6,25,20,'#5a3432');
 c.globalAlpha=b;
 const OL='#7a5f66',CR='#fff8e7',SH='#e6d2c0';
 // ソーサー
 ell(c,cx,cy+19,27,5,OL);ell(c,cx,cy+19,26,4,CR);ell(c,cx,cy+20,22,2,SH);ell(c,cx,cy+18,14,2,SH);
 // 取っ手
 for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){const d=Math.hypot(dx,dy*1.05);if(d>3.3&&d<=6.6){R(c,cx+22+dx,cy+8+dy,1,1,(d>5.6||d<4.2)?OL:CR)}}
 // カップ
 for(let dy=0;dy<=17;dy++){const hw=Math.round(19*Math.sqrt(1-Math.pow(dy/20,2.2))-(dy>14?(dy-14)*1.5:0));
  R(c,cx-hw-1,cy+dy,hw*2+3,1,OL);R(c,cx-hw,cy+dy,hw*2+1,1,CR);R(c,cx+hw-4,cy+dy,5,1,SH);if(dy>12)R(c,cx-hw,cy+dy,hw*2+1,1,SH);R(c,cx-hw+2,cy+dy,1,1,'#ffffff')}
 R(c,cx-8,cy+18,17,2,OL);R(c,cx-7,cy+18,15,1,SH);
 for(let dx=-17;dx<=17;dx++)if((dx+40)%2===0)R(c,cx+dx,cy+5,1,1,'#d9a066');
 // 小花もよう
 R(c,cx-3,cy+10,3,1,'#d95763');R(c,cx-2,cy+9,1,3,'#d95763');R(c,cx-2,cy+10,1,1,'#fbf236');R(c,cx-5,cy+12,2,1,'#6abe30');R(c,cx,cy+12,2,1,'#6abe30');
 R(c,cx-12,cy+9,1,1,'#e8b4d4');R(c,cx+8,cy+11,1,1,'#e8b4d4');
 // ふち・紅茶
 ell(c,cx,cy,20,4,OL);ell(c,cx,cy,19,3,CR);ell(c,cx,cy+1,17,2,'#8f4a1e');ell(c,cx,cy+1,16,1,'#c26a2a');R(c,cx-11,cy,7,1,'#e9a25a');R(c,cx+4,cy+2,5,1,'#e9a25a');
 // 湯気
 for(let w=0;w<3;w++){const off=(w-1)*8;for(let k=0;k<17;k++){const yy=cy-5-k*2-Math.floor((T*5+w*3)%2),xx=cx+off+Math.round(Math.sin(T*1.2+k*.42+w*2)*(1.2+k*.16));
   c.globalAlpha=b*(1-k/17)*.6*(.6+.4*Math.sin(T*2+k+w));R(c,xx,yy,k%4===0?2:1,1,'#fff8e7')}}
 // 3つのハーブ
 const hb=clamp((a-.6)/.4,0,1);
 ['mint','thyme','chamomile'].forEach((k,i)=>{const hx=cx+(i-1)*34,hy=cy-34-(i===1?16:0)+Math.round(Math.sin(T*1.5+i*2.1)*2.5)+Math.round((1-hb)*10);
  c.globalAlpha=hb;c.drawImage(IM[k],hx-8,hy-8);
  const ph=((T+i*.8)/2.4)%1;if(ph<.25&&hb>=1)star(c,hx+[-6,7,5][i],hy+[-5,-6,6][i],ph/.25)});
 c.globalAlpha=1;
}

/* ───────── 入力 ───────── */
function onTap(x,y){
 if(S.mode==='title')return;
 hideTip();
 if(S.mode==='dialog'){tapDlg();return}
 if(S.mode==='end'){if(T-S.endAt>1.8)toTitle();return}
 const k=placeAt(x,y);
 if(k){const s=standOf(k);go(s.x,s.y,{k,fx:s.fx,fy:s.fy})}else go(clamp(x,2,W-2),clamp(y,2,H-2))}
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.ui'))return;e.preventDefault();const r=cv.getBoundingClientRect();onTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H)});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(S.mode==='dialog'){e.preventDefault();tapDlg()}else if(S.mode==='end'&&T-S.endAt>1.8)toTitle()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('start').addEventListener('click',()=>{S.mode='play';$('title').classList.add('hide');if(A.on)ac()});
$('snd').addEventListener('click',()=>{A.on=!A.on;if(A.on){ac();tone(880,.12,'triangle',.04);tone(1320,.2,'triangle',.04,.1)}$('snd').classList.toggle('on',A.on);$('snd').textContent=A.on?'♪ ON':'♪ OFF'});
// アイテムの説明
let tipTimer=0;
function showTip(k){const h=HERB[k],t=$('tip');t.innerHTML='';const b=document.createElement('b'),d=document.createElement('span');
 if(S.herbs[k]){b.textContent=h.name+'「'+h.piece+'」';d.textContent=h.tip}else{b.textContent='？？？';d.textContent='まだ見つけていないハーブ。'}
 t.appendChild(b);t.appendChild(d);t.classList.remove('off')}
function hideTip(){clearTimeout(tipTimer);$('tip').classList.add('off')}
document.querySelectorAll('.slot').forEach(s=>{const k=s.dataset.k;
 s.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){clearTimeout(tipTimer);showTip(k)}});
 s.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});
 s.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){showTip(k);clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,3000)}});
 s.addEventListener('animationend',()=>s.classList.remove('pop'))});

function toTitle(){
 S=fresh();D.lines=null;D.busy=false;P.x=OX+80;P.y=PL.bot-1;P.face='up';P.path=null;P.walk=false;P.mark=null;P.goal=null;parts.length=0;
 setGate(false);$('end').classList.remove('show');$('dlg').classList.add('off');$('portrait').classList.remove('show');$('items').style.opacity=1;hideTip();
 document.querySelectorAll('.slot').forEach(s=>{s.classList.add('empty');s.innerHTML=''});
 $('title').classList.remove('hide')}

/* ───────── 画面に合わせる ───────── */
function fit(){
 // 1ドットを「端末の画素の整数倍」にそろえる。余った幅は左右に森を広げて埋める
 const vw=innerWidth,vh=innerHeight,dpr=window.devicePixelRatio||1,dw=vw*dpr,dh=vh*dpr;
 const s=Math.max(1,Math.floor(Math.min(dw/CW,dh/264)+1e-6));
 const h=clamp(Math.floor(dh/s+1e-6),200,440),w=Math.max(CW,Math.min(Math.floor(dw/s+1e-6),Math.floor(h*.62)));
 U=s/dpr;
 stage.style.width=w*U+'px';stage.style.height=h*U+'px';
 stage.style.left=Math.max(0,Math.round((dw-w*s)/2))/dpr+'px';stage.style.top=Math.max(0,Math.round((dh-h*s)/2))/dpr+'px';stage.style.setProperty('--u',U+'px');
 if(h!==H||w!==W||!built){const oldH=H,oldOX=OX;H=h;W=w;OX=Math.floor((W-CW)/2);cv.width=W;cv.height=H;nightC=mk(W,H);ngx=nightC.getContext('2d');
  layout();buildBG();buildEnts();buildGrid();
  if(built){P.x+=OX-oldOX;P.y=clamp(P.y*H/oldH,50,H-28);P.path=null;P.walk=false;P.goal=null;P.mark=null;
   const [cx,cy]=ci(P.x,P.y);if(blocked[cy*GC+cx]){const r=route(P.x,P.y);if(r&&r.length){P.x=r[0][0];P.y=r[0][1]}}}
  else{P.x=OX+80;P.y=PL.bot-1}
  built=true}
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function boot(){S=fresh();fit();$('hero').src=SRC.down;addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));requestAnimationFrame(loop)}
let pending=0;
for(const k in SRC){pending++;const im=new Image();im.onload=im.onerror=()=>{if(--pending===0)boot()};im.src=SRC[k];IM[k]=im}
})();
</script>
