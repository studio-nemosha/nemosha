<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>おとぎの森を散歩する（試作版）｜Studio NEMOSHA</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1d2b1f;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;font-family:'DotGothic16',monospace}
  #wrap{position:relative}
  canvas{display:block;image-rendering:pixelated}
  #portrait{position:absolute;left:3%;bottom:calc(3% + 46px);height:44%;z-index:1;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
  #portrait.on{opacity:1;transform:none}
  #msg{z-index:2;position:absolute;left:4%;right:4%;bottom:3%;background:#fff8e7;border:3px solid #3a2a1e;border-radius:6px;
       padding:12px 14px 22px;color:#3a2a1e;font-size:15px;line-height:1.6;display:none;box-shadow:0 3px 0 #3a2a1e}
  #msg .name{font-size:13px;color:#7a4e9c;margin-bottom:2px}
  #msg .next{position:absolute;right:10px;bottom:4px;font-size:12px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  #tip{position:absolute;left:2%;bottom:calc(var(--hud) + 6px);max-width:70%;background:rgba(255,248,231,.97);border:2px solid #3a2a1e;border-radius:5px;
       padding:6px 9px;color:#3a2a1e;font-size:13px;line-height:1.5;display:none;box-shadow:0 2px 0 #3a2a1e;pointer-events:none}
  #tip b{font-weight:normal;color:#7a4e9c}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
         background:rgba(20,34,22,.82);color:#fff8e7;text-align:center;gap:14px}
  #title .badge{font-size:12px;letter-spacing:.1em;border:2px solid #fff8e7;border-radius:999px;padding:2px 12px;opacity:.9}
  #title p.small{font-size:12px;opacity:.75}
  #title a{color:#fff8e7;font-size:13px}
  #title h1{font-size:22px;margin:0;font-weight:normal;letter-spacing:.08em}
  #title p{margin:0;font-size:13px;line-height:1.8;opacity:.9}
  #title button{font-family:inherit;font-size:16px;padding:8px 22px;background:#c9e3a1;border:3px solid #3a2a1e;border-radius:6px;color:#3a2a1e;box-shadow:0 3px 0 #3a2a1e}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <img id="portrait" alt="">
  <div id="msg"><div class="name"></div><div class="text"></div><div class="next">▼ タップ</div></div>
  <div id="tip"></div>
  <div id="title">
    <span class="badge">試作版</span>
    <h1>おとぎの森を散歩する</h1>
    <p>種もんが、森で物語のハーブを集めるおはなし。<br>行きたい場所をタップしてね。</p>
    <button id="start">はじめる</button>
    <p class="small">森は少しずつ育っています。</p>
    <a href="./">← Studio NEMOSHAへもどる</a>
  </div>
</div>
<script>
const W=192,H=320;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const BEAR=new Image();BEAR.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA1klEQVR4Xq2SMQ7CMAxFHcQEEwfowAYjbCDWXgXOBFdhRbDBCFsHDtCprEG/lYvtOkVCvCl18r/cbwcy5LNN5NLxcQo4ezWmfsDg4XRS1Z9FOVbWss7GYGg7mGcjuj9frUCCu6LUioE1gDiFd9cayPb7wK/ITDodgMPl1vHwam4GYLta0P58pRCajGOMROul21hyCgAmYCfEmI6cgjIAfVlYMVAZSDFGxvDZBqgMrBgjg5D3ImWiFumzfc02yrnjbLcT/DeDX3AXiUHLXttfQaByXe235A1a6m0B6MfFbQAAAABJRU5ErkJggg==';
const WOLF2=new Image();WOLF2.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAAXNSR0IArs4c6QAAARFJREFUOI2Vk71KA0EUhb9VSxEEsbFfFrZIEIdgLTbabbGwRUgdbPQFgkIgj7Kwxb6BtYQEQXEx7APYaGsnrtUMN/ND4ilnON89cy4DG1TkWVfkWRe639kEAEgTRQiyF5oqzQCD8wuArqzqKAjwGaWGo7ED2ZXm4WhMr694fVny+fXB8dEJAPuHB8RxDECvr/j9+b5/a94ftu7g9u6Gq+tLJ4kBFHnW2ZHLqo6a1QKA6WTGdDKze3I7eJ4vOR2cmSeliUJD0kTRti3zp0czwAFoiJROpkH2FpwO5EQfyJah+VbYrBZrRl8Kk0AfSoPsIJRiqzXK6f8C+Ez2v1gDyN3bke3naEXOiVVoWdWR/RNliX9V5HWS+Tq7BQAAAABJRU5ErkJggg==';
const WOLF=new Image();WOLF.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAAXNSR0IArs4c6QAAAPpJREFUOI2NkzFqw0AQRd8alSaQSwiBamFShzRxp0KgIqQ2bpwLuDL4KAIVuoHrIGTcCYQusy6StcezWuQpd/a/mfmzCzNRFrkti9yG8os5AECaZIQgUaiqFAOs3t4BbFU3xgM4gUw6oYyv740Hicoit/+JW7KqG1MWWAdZvr4Qx/Ek5CkPdj9bPtcfXiceQJpV1Y3phw6Aw/7IYX/UPt09ALi0Z33BpkmGg6RJxjiOtL8npF/RlFh3BdxAegtGVnPRD93kFvqh8wALPa8UuzM9mgeQEFlZekDgbTy1xlA3s4Apkf4XDwDphW5Zj+PCeCfKqL9n/Wic3MQVBT+AJooozroAAAAASUVORK5CYII=';
const SPR={};for(const [k,v] of Object.entries({"down": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAzklEQVR4XmNgoBAwwvTL2an8h7EfHboDF0cG2NQwISvwaeABc5EVolsAUwMDLOg+YDPVhxjCwPAf5hKQgTBxBoa7KFpQnIqqkIHh1+mLYMUIzRAxZC9i+BXm/InLIlBsyo9aAeajhw9KGODSDAIwA9HDByUW0G3FBUCugbkE7AKQqdXLdXBqQAcgi2AuQfECOQDDgECZFjBGB7jEMdLB+ic1cL1axc/B7Gu9kijiyIBiL6DEAiggxf4TDkzkWMBIiYRiozXyCnEpERdAT4kA40JVcaiWo44AAAAASUVORK5CYII=", "right": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA1UlEQVR4XmNgoBAwwvTL2an8h7EfHbpDUBwGmJAd4NPAA+bCDIPRMHFsgAVdkM1UH2IIA8N/GJuB4S5WzSAAdyrMZoQmBoZfpy/CNSJ7CxmgGIDs/InLIlAU5ketAPPRDUIJA5if0TWDAEwMObBRvACSwKYRGwC5BuYSsAtAmquX6zC8YryCVQM6AFkEcwmKF8gBGNGIDQTKtMCF1z+pQVFClAHompABhhdwhYNW8fM6EEZ3IdgAUIi2RhIXgCCAHAsYKREUG/gAyCLkxIQzJeIC6CkRALkDUEjfGLXsAAAAAElFTkSuQmCC", "left": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA1ElEQVR4XmNgoBAwYtMvZ6fyHyb+6NAduBps4ky4HODTwAOWgmmC0TBxGGDB5wM2U32IIQwM/2FsBoa7KFqwegHZZhBAaGZg+HX6Ioq3MAyAOXXisggUm/KjVoD5yGECAihhgEszCMAMRA5IEEAJYXRbcQGQa2AuAbsAZCqxml8xXmGoXq4DdwnOaCQWYERjoEwLXO/6JzUEzcEwgBhNyADDC1rFz+tAGJvVIP+jA7ABoBCFxTMxoDXyCjwWUBISKDZAIYwPIGtGSQcwgJ5Q0AF6SgQA6PBQSE7BWsUAAAAASUVORK5CYII=", "up": "iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAx0lEQVR4XmNgoBAwwvTL2an8h7EfHboDF0cG2NQwISvwaeABc5EVolsAUwMDLOg+YDPVhxjCwPAf5hKQgTBxBoa7KFpQnIqqkIHh1+mLYMUIzRAxZC9i+BXmfGRNIAAzDD18MFwAUjxxWQS6z8AgP2oFmMbqApDNuDSiA5BBMEPAsQDSXL1ch+EV4xWsNiMDkBqQWphXUaKRHEB9A/B5A5scRkICAWLCAgbAXgCFaGsk4QCEAZBalFggxRBkzSCAMyXiAugpEQBIY1W6u9ivQwAAAABJRU5ErkJggg=="})){SPR[k]=new Image();SPR[k].src='data:image/png;base64,'+v}
let S=2,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;
  S=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*S)+'px';cv.style.height=(H*S)+'px';
  cv.width=Math.round(W*S*dpr);cv.height=Math.round(H*S*dpr);
  ctx.setTransform(S*dpr,0,0,S*dpr,0,0);ctx.imageSmoothingEnabled=false;
  document.getElementById('msg').style.fontSize=Math.max(13,Math.min(17,S*7))+'px';
}
window.addEventListener('resize',resize);resize();

// ---- 乱数（毎回同じ森になるように固定） ----
let seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}

// ---- 場所 ----
const spots={
  house:{x:96,y:46,r:22},
  rocks:{x:152,y:118,r:20},
  lake:{x:44,y:150,r:24},
  fire:{x:100,y:196,r:14},
  flowers:{x:146,y:240,r:22},
};
const herbs=[
  {id:'mint',name:'ミント',piece:'すきとおる記憶',desc:'湖のほとりで。水面にゆれた、なつかしい女の子の笑顔。',spot:'lake',x:66,y:166,col:'#5fbf8a',got:false},
  {id:'thyme',name:'タイム',piece:'ひとりで立つ強さ',desc:'オオカミさんの岩場で。強い草は、ひとりでも折れない。',spot:'rocks',x:138,y:132,col:'#8a9a5b',got:false},
  {id:'chamo',name:'カモミール',piece:'やすらぎ',desc:'くまたんのお花畑で。眠れない夜の、おやすみの味。',spot:'flowers',x:132,y:252,col:'#f6e27a',got:false},
];

// 木（道や場所をよけて配置）
const trees=[];
for(let i=0;i<140&&trees.length<34;i++){
  const x=6+rnd()*180,y=70+rnd()*246;
  let ok=true;
  for(const k in spots){const s=spots[k];if(Math.hypot(x-s.x,y-s.y)<s.r+16)ok=false}
  if(Math.abs(x-96)<14&&y>200)ok=false;
  for(const t of trees)if(Math.hypot(x-t.x,y-t.y)<16)ok=false;
  if(ok)trees.push({x:Math.round(x),y:Math.round(y),s:rnd()<.5?0:1});
}
// 上の森の縁
for(let x=0;x<200;x+=14){if(Math.abs(x-96)>30)trees.push({x:x,y:14+((x*7)%9),s:1})}
trees.sort((a,b)=>a.y-b.y);
const flowerDots=[];for(let i=0;i<46;i++){const a=rnd()*6.28,r=Math.sqrt(rnd())*24;flowerDots.push({x:spots.flowers.x+Math.cos(a)*r*1.2,y:spots.flowers.y+Math.sin(a)*r*.7,c:['#fff','#f6e27a','#f4a7c0','#fff'][i%4]})}
const grass=[];for(let i=0;i<160;i++)grass.push({x:Math.floor(rnd()*W),y:Math.floor(rnd()*H)});

// ---- 主人公 ----
const p={x:96,y:300,tx:96,ty:300,dir:'up',walk:0};
const visited={};
let state='title',dialog=[],dIdx=0,onDialogEnd=null,t=0,ending=false;

// ---- 描画ヘルパー ----
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawTree(tr){
  const {x,y}=tr;
  R(x-1,y-2,3,6,'#5a3b24');
  if(tr.s){R(x-6,y-10,13,8,'#2f6b3a');R(x-4,y-15,9,6,'#2f6b3a');R(x-2,y-19,5,5,'#3e8a49');R(x-4,y-9,3,2,'#3e8a49')}
  else{R(x-6,y-14,13,12,'#3e8a49');R(x-4,y-16,9,2,'#3e8a49');R(x-6,y-6,13,3,'#2f6b3a');R(x-3,y-13,3,3,'#5aa65e')}
}
function drawLake(){
  const {x,y}=spots.lake;
  for(let j=-14;j<=14;j++){const w=Math.round(Math.sqrt(1-(j/14.5)**2)*28);R(x-w,y+j,w*2,1,'#3d7fb0')}
  for(let j=-11;j<=11;j++){const w=Math.round(Math.sqrt(1-(j/12)**2)*23);R(x-w,y+j,w*2,1,'#5aa0cf')}
  const sh=Math.floor(t/30)%2;R(x-10+sh*2,y-4,6,1,'#cfe8f5');R(x+4-sh*2,y+5,8,1,'#cfe8f5');
  // 葦
  R(x+24,y-8,1,6,'#6b8f3a');R(x+26,y-10,1,8,'#6b8f3a');R(x-27,y+4,1,6,'#6b8f3a');
}
function drawRocks(){
  const {x,y}=spots.rocks;
  const rocks=[[-14,-6,14,10],[0,-12,16,14],[6,2,14,9],[-10,4,10,7]];
  for(const r of rocks){R(x+r[0],y+r[1],r[2],r[3],'#7d7f86');R(x+r[0],y+r[1],r[2],2,'#a3a5ab');R(x+r[0],y+r[1]+r[3]-2,r[2],2,'#5b5d63')}
}
function drawWolf(){
  const x=spots.rocks.x,y=spots.rocks.y-27;
  const im=Math.floor(t/45)%2?WOLF2:WOLF;
  if(im.complete)ctx.drawImage(im,x,y,16,16);
}
function drawFlowers(){
  const {x,y}=spots.flowers;
  for(let j=-16;j<=16;j++){const w=Math.round(Math.sqrt(1-(j/17)**2)*32);R(x-w,y+j,w*2,1,'#6fae5a')}
  for(const f of flowerDots){R(f.x,f.y,2,2,f.c);R(f.x,f.y+2,1,1,'#3e8a49')}
}
function drawBear(){
  const x=spots.flowers.x+6,y=spots.flowers.y-14;
  const b=Math.floor(t/40)%2;
  R(x+2,y+15,12,2,'rgba(0,0,0,.18)');
  if(BEAR.complete)ctx.drawImage(BEAR,x,y-b,16,16);
}
function drawFire(){
  const {x,y}=spots.fire;
  // 座る丸太
  R(x-16,y+4,9,4,'#7a4e2d');R(x+8,y+4,9,4,'#7a4e2d');
  R(x-5,y+3,11,3,'#5a3b24');R(x-4,y+1,9,2,'#7a4e2d');
  const f=Math.floor(t/8)%3;
  R(x-3,y-4,7,5,'#e8642c');R(x-2,y-7-f,5,4,'#f39a2e');R(x-1,y-9+f%2,3,3,'#f8d24a');
  if(f==1)R(x+2,y-12,1,1,'#f8d24a');
  ctx.globalAlpha=.12+.04*f;ctx.fillStyle='#f8d24a';ctx.beginPath();ctx.arc(x,y-2,20,0,6.3);ctx.fill();ctx.globalAlpha=1;
}
function drawHouse(open){
  const {x,y}=spots.house;
  // 小道と庭
  R(x-4,y+16,9,10,'#b8a06a');
  // 壁
  R(x-18,y-6,36,24,'#d8c2a0');R(x-18,y+16,36,2,'#a88a64');
  for(let i=0;i<4;i++)R(x-18,y-2+i*5,36,1,'#c6ad87');
  // 屋根
  for(let i=0;i<14;i++)R(x-22+i,y-6-i,44-i*2,1,i%3==0?'#5b3f7a':'#6e4c93');
  // 煙突と湯気
  R(x+8,y-20,5,9,'#8a5a3a');
  for(let i=0;i<3;i++){const k=(t/2+i*14)%42;ctx.globalAlpha=1-k/42;R(x+9+Math.sin((k+i)/6)*3,y-24-k/1.4,3,3,'#fff');}
  ctx.globalAlpha=1;
  // 窓（あたたかい灯り）
  R(x-14,y+1,8,7,'#3a2a1e');R(x-13,y+2,6,5,'#f8d27a');R(x-10,y+2,1,5,'#3a2a1e');
  R(x+7,y+1,8,7,'#3a2a1e');R(x+8,y+2,6,5,'#f8d27a');R(x+11,y+2,1,5,'#3a2a1e');
  // 扉
  R(x-4,y+4,9,14,'#3a2a1e');R(x-3,y+5,7,13,open?'#f8d27a':'#7a4e2d');R(x+2,y+11,1,1,'#f2d04b');
  // ティーポットの看板
  R(x-3,y-4,7,5,'#fff8e7');R(x-2,y-3,4,3,'#c27a9a');R(x+2,y-2,2,1,'#c27a9a');
  // 柵
  if(!open){R(x-26,y+24,52,1,'#7a4e2d');for(let i=-26;i<=26;i+=4)R(x+i,y+21,1,5,'#7a4e2d')}
}
function drawHerb(h){
  if(h.got)return;
  const b=Math.sin(t/12)*1.5;
  R(h.x,h.y+b,1,5,'#3e6b2a');R(h.x-2,h.y+1+b,2,2,h.col);R(h.x+1,h.y-1+b,2,2,h.col);R(h.x-1,h.y-2+b,2,2,h.col);
  if(Math.floor(t/10)%4==0){R(h.x+3,h.y-4+b,1,1,'#fff');R(h.x-4,h.y-3+b,1,1,'#fff')}
}
function drawPlayer(){
  const moving=Math.hypot(p.tx-p.x,p.ty-p.y)>1;
  const hop=moving?Math.abs(Math.sin(p.walk/4))*3:Math.sin(t/20)*.6;
  ctx.fillStyle='rgba(0,0,0,.18)';R(p.x-7,p.y-1,14,3,'rgba(0,0,0,.18)');
  const im=SPR[p.dir];
  if(im&&im.complete)ctx.drawImage(im,Math.round(p.x)-8,Math.round(p.y-hop)-16,16,16);
}
function drawHUD(){
  R(4,H-18,64,14,'rgba(255,248,231,.85)');R(4,H-18,64,1,'#3a2a1e');R(4,H-5,64,1,'#3a2a1e');R(4,H-18,1,14,'#3a2a1e');R(67,H-18,1,14,'#3a2a1e');
  herbs.forEach((h,i)=>{const x=12+i*20,y=H-14;
    if(h.got){R(x+2,y,1,7,'#3e6b2a');R(x,y+2,2,2,h.col);R(x+3,y,2,2,h.col);R(x+1,y-1,2,2,h.col);R(x+4,y+3,2,2,h.col)}
    else{R(x,y,7,7,'#d8cdb4')}
  });
}
function drawGround(){
  R(0,0,W,H,'#7fb86a');
  for(const g of grass)R(g.x,g.y,1,2,'#6aa356');
  // 小道
  const path=[[96,320],[96,214],[100,196],[96,150],[96,70]];
  ctx.strokeStyle='#c9b27a';ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  path.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
  for(const b of [[[100,196],[spots.lake.x+24,spots.lake.y+6]],[[100,196],[spots.flowers.x-20,spots.flowers.y-6]],[[96,140],[spots.rocks.x-18,spots.rocks.y+4]]]){
    ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(...b[0]);ctx.lineTo(...b[1]);ctx.stroke();
  }
}
function draw(){
  drawGround();drawLake();drawFlowers();drawRocks();drawFire();
  drawHouse(herbs.every(h=>h.got));
  herbs.forEach(drawHerb);
  // 奥行き順に描く
  const list=trees.map(tr=>({y:tr.y,f:()=>drawTree(tr)}));
  list.push({y:p.y,f:drawPlayer},{y:spots.rocks.y-10,f:drawWolf},{y:spots.flowers.y+3,f:drawBear});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // 目的地マーカー
  if(Math.hypot(p.tx-p.x,p.ty-p.y)>2){R(p.tx-2,p.ty,5,1,'#fff8e7');R(p.tx,p.ty-2,1,5,'#fff8e7')}
  drawNight();
  drawHUD();
  if(ending)drawEnding();
}
let night=0;
let nightOn=false;
const flies=[];for(let i=0;i<6;i++)flies.push({x:rnd()*W,y:80+rnd()*230,p:rnd()*6.28,s:.08+rnd()*.1});
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(1,c.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function drawNight(){
  if(night<=0)return;
  ctx.fillStyle=`rgba(18,26,68,${.6*night})`;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const h=spots.house,f=spots.fire;

const portrait=document.getElementById('portrait');
function say(lines,cb){showTip(-1);
  const who=lines.map(l=>PORT_OF[l[0]]).find(Boolean);
  if(who){portrait.src=PORT[who];requestAnimationFrame(()=>portrait.classList.add('on'))}else portrait.classList.remove('on');dialog=lines;dIdx=0;onDialogEnd=cb||null;state='talk';showLine()}
function showLine(){const l=dialog[dIdx];msg.style.display='block';msg.querySelector('.name').textContent=l[0];msg.querySelector('.text').textContent=l[1]}
function nextLine(){dIdx++;if(dIdx>=dialog.length){msg.style.display='none';portrait.classList.remove('on');state='walk';const cb=onDialogEnd;onDialogEnd=null;if(cb)cb()}else showLine()}
function getHerb(id){const h=herbs.find(h=>h.id===id);h.got=true;if(herbs.every(h=>h.got))nightOn=true}
function count(){return herbs.filter(h=>h.got).length}

const events={
  lake(){ if(visited.lake)return;visited.lake=1;
    say([['','湖をのぞきこむと、水面にだれかの姿がゆれた。'],
         ['','……まぶしそうに笑う、ひとりの女の子。'],
         ['','なつかしいような、まだ会ったことがないような。'],
         ['','ほとりのミントが、すっと香った。'],
         ['✿ ミントを手に入れた','物語のかけら「すきとおる記憶」']],()=>getHerb('mint'))},
  rocks(){ if(visited.rocks){
      say([['オオカミさん','オレはここにいる。いつでも。'],
           ['オオカミさん','居場所を見失ったら、耳を澄ましてみてくれ。……アオオオーーーン！'],
           ['','オオカミさんの声は、だれかの夜を そっとなぐさめる。「ことばと声」のたましい。']]);return}
    visited.rocks=1;
    say([['オオカミさん','……ここはオレの縄張りだ。小さいのが何の用だ。'],
         ['オオカミさん','ふん。ハーブ集めか。'],
         ['オオカミさん','岩のすきまのタイムを持っていけ。強い草は、ひとりでも折れない。'],
         ['✿ タイムを手に入れた','物語のかけら「ひとりで立つ強さ」']],()=>getHerb('thyme'))},
  flowers(){ if(visited.flowers){
      say([['くまたん','お花、いいにおい！ 風がきもちいいな。'],
           ['くまたん','このかんじ、わすれたくないな。みんなに伝えたいな。'],
           ['','くまたんの手は、心地よさを そっとかたちにする。「つくる」のたましい。']]);return}
    visited.flowers=1;
    say([['くまたん','あっ、種もん！ いらっしゃい。'],
         ['くまたん','ここのカモミールはね、眠れない夜に摘むんだ。'],
         ['くまたん','ひとつあげる。ゆっくりおやすみの味がするよ。'],
         ['✿ カモミールを手に入れた','物語のかけら「やすらぎ」']],()=>getHerb('chamo'))},
  fire(){
    const n=count();
    const lines=n===0?[['','パチパチ……焚き火があたたかい。'],['','森の奥から、紅茶のいい香りがする。'],['','ハーブを3つ集めたら、だれかに会える気がする。']]
      :n<3?[['','焚き火にあたって、ひとやすみ。'],['',`ハーブは${n}つ。あと${3-n}つ。`]]
      :[['','日がくれて、森に夜がきた。'],['','3つのハーブが、火のそばでやさしく香った。'],['','森の奥の、柵がひらいたみたい。']];
    say(lines)},
  house(){
    if(count()<3){ if(visited['h'+count()])return;visited['h'+count()]=1;
      say([['','紅茶とアンティークの、小さなお家。'],['','柵がしまっている。ハーブの香りが、まだ足りないみたい。']]);return}
    if(ending)return;ending=true;endT=0;
    setTimeout(()=>say([
      ['魔女さん','いらっしゃい、小さな種さん。ずっと待っていたのよ。'],
      ['魔女さん','ミント、タイム、カモミール……いいブレンドになりそうね。'],
      ['魔女さん','どうぞ。あなたが歩いてきた森の味の紅茶よ。'],
      ['魔女さん','……わたしもむかしは、あなたみたいな小さな種だったの。'],
      ['','── おしまい ──'],
      ['','また森を歩きにおいでね。（タップで最初から）']],restart),1400)}
};
function restart(){document.getElementById('title').style.display='flex';state='title';ending=false;herbs.forEach(h=>h.got=false);for(const k in visited)delete visited[k];p.x=p.tx=96;p.y=p.ty=300;p.dir='up';night=0;nightOn=false}

function checkArrive(){
  for(const k in spots){const s=spots[k];
    const reach=k==='house'?{x:s.x,y:s.y+32}:k==='rocks'?{x:s.x-14,y:s.y+8}:k==='lake'?{x:s.x+26,y:s.y+10}:k==='fire'?{x:s.x,y:s.y+20}:s;
    if(Math.hypot(p.x-reach.x,p.y-reach.y)<(k==='fire'?16:14)){events[k]();return}}
}

// ---- アイテムの説明 ----
const tip=document.getElementById('tip');
function hudSlot(x,y){if(y<H-20||y>H-2)return -1;for(let i=0;i<3;i++){const sx=8+i*20;if(x>=sx&&x<sx+18)return i}return -1}
function showTip(i){
  if(i<0){tip.style.display='none';return}
  const h=herbs[i];
  tip.innerHTML=h.got?`<b>✿ ${h.name}</b>　「${h.piece}」<br>${h.desc}`:'<b>？？？</b><br>まだ見つけていないハーブ。';
  tip.style.setProperty('--hud',(18*S)+'px');tip.style.left=(8+i*20)*S+'px';tip.style.display='block';
}
let tipTimer=null;
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||state!=='walk')return;
  const r=cv.getBoundingClientRect();const i=hudSlot((e.clientX-r.left)/S,(e.clientY-r.top)/S);
  showTip(i);cv.style.cursor=i>=0?'help':'default';
});
cv.addEventListener('pointerleave',()=>showTip(-1));

// ---- 入力 ----
cv.addEventListener('pointerdown',e=>{
  if(state==='title')return;
  if(state==='talk'){nextLine();return}
  const r=cv.getBoundingClientRect();let x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S;
  const slot=hudSlot(x,y);
  if(slot>=0){showTip(slot);clearTimeout(tipTimer);if(e.pointerType!=='mouse')tipTimer=setTimeout(()=>showTip(-1),2800);return}
  showTip(-1);
  // 場所をタップしたら、その入口に向かう
  for(const k in spots){const s=spots[k];if(Math.hypot(x-s.x,y-s.y)<s.r){
    if(k==='house'){x=s.x;y=s.y+32}else if(k==='rocks'){x=s.x-14;y=s.y+8}else if(k==='lake'){x=s.x+26;y=s.y+10}else if(k==='fire'){x=s.x;y=s.y+20}else{x=s.x-6;y=s.y+4}}}
  p.tx=Math.max(8,Math.min(W-8,x));p.ty=Math.max(64,Math.min(H-4,y));
});
msg.addEventListener('pointerdown',e=>{e.stopPropagation();if(state==='talk')nextLine()});
document.getElementById('start').onclick=()=>{document.getElementById('title').style.display='none';state='walk'};

// ---- ループ ----
function loop(){
  t++;
  const goal=nightOn?1:0;night+=(goal-night)*.008;if(goal===0&&night<.01)night=0;
  if(state==='walk'&&!ending){
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d>0.01){const sp=Math.min(.9,d);p.x+=dx/d*sp;p.y+=dy/d*sp;p.walk++;if(Math.abs(dx)>Math.abs(dy))p.dir=dx>0?'right':'left';else p.dir=dy>0?'down':'up';
      if(Math.hypot(p.tx-p.x,p.ty-p.y)<0.01){p.x=p.tx;p.y=p.ty;checkArrive()}}
  }
  draw();requestAnimationFrame(loop);
}
loop();
</script>
